{% extends "admin/base_admin.html" %}
{% block contenido %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Categorías</h3>
        <a href="{{ url_for('admin.nueva_categoria') }}" class="btn btn-dark btn-sm">+ Nueva categoría</a>
    </div>

    <table class="table table-striped table-sm">
        <thead>
            <tr><th>Descripción</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
            {% for c in categorias %}
            <tr>
                <td>{{ c.Descripcion }}</td>
                <td>
                    {% if c.Activo %}<span class="badge bg-success">Activa</span>
                    {% else %}<span class="badge bg-secondary">Inactiva</span>{% endif %}
                </td>
                <td><a href="{{ url_for('admin.editar_categoria', id_categoria=c.IdCategoria) }}" class="btn btn-outline-dark btn-sm">Editar</a></td>
            </tr>
            {% else %}
            <tr><td colspan="3" class="text-muted text-center">Aún no hay categorías.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
